name: Aggiorna dati INGV

on:
  schedule:
    - cron: '*/5 * * * *'  # Ogni 5 minuti
  workflow_dispatch:        # Per eseguire manualmente

permissions:
  contents: write

jobs:
  update-ingv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          pip install obspy scipy numpy

      - name: Esegui script INGV
        run: python scripts/ingv_tremor_all.py

      - name: Commit e push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ingv_all.json
          git diff --staged --quiet || git commit -m "Aggiornamento automatico INGV"
          git push
