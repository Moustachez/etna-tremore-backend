name: Calcola tremore Etna

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tremor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Installa dipendenze
        run: |
          pip install requests
      
      - name: Esegui script
        run: python scripts/compute_tremor.py
      
      - name: Verifica file JSON
        run: |
          cat docs/tremore.json || echo "File non ancora creato"
      
      - name: Commit e push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/tremore.json
          git diff --staged --quiet || git commit -m "Aggiornamento automatico tremore"
          git push
