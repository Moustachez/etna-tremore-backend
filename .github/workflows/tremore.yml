name: Calcola tremore Etna

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-tremor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa requests
        run: pip install requests

      - name: Esegui script
        run: python scripts/compute_tremor.py

      - name: Commit e push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/tremore.json
          git diff --staged --quiet || git commit -m "Aggiornamento automatico tremore"
          git push
