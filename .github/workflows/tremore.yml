name: Calcola tremore Etna

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tremor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Installa dipendenze
        run: |
          pip install requests
      
      - name: Esegui script
        run: python scripts/compute_tremor.py
      
      - name: Commit e push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add docs/tremore.json
          git diff --staged --quiet || git commit -m "Aggiorna tremore da EtnaMonitor"
          git push
