name: Calcola tremore Etna

on:
  schedule:
    # Ogni 10 minuti. GitHub Actions usa sempre l'orario UTC.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # permette anche l'avvio manuale dal sito GitHub

permissions:
  contents: write

jobs:
  calcola-tremore:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Calcola il tremore
        run: python scripts/compute_tremor.py

      - name: Salva il risultato aggiornato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/tremore.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Aggiorna tremore Etna"
          git push
