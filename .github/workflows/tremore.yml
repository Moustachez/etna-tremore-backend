name: Calcola tremore Etna

on:
  schedule:
    - cron: '*/10 * * * *'  # Ogni 10 minuti
  workflow_dispatch:         # Permette di eseguire manualmente

jobs:
  update-tremor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests numpy

      - name: Run tremor computation
        run: python scripts/compute_tremor.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/tremore.json
          git diff --staged --quiet || git commit -m "Aggiorna dati tremore da EtnaMonitor"
          git push
