<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tremore vulcanico Etna</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    background: #ffffff;
    color: #1a1a1a;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  #status { color: #555; font-size: 0.95rem; margin-bottom: 16px; }
  img { max-width: 100%; border-radius: 10px; display: block; }
  .footer { font-size: 0.8rem; color: #888; margin-top: 16px; line-height: 1.4; }
</style>
</head>
<body>
  <h1>Tremore vulcanico Etna</h1>
  <p id="status">Caricamento dati...</p>
  <img id="chart" src="tremore_chart.png" alt="Grafico del tremore vulcanico" />
  <p class="footer">
    Valore calcolato da forme d'onda sismiche pubbliche INGV (rete IV),
    aggiornato ogni 10 minuti. Bande: verde (quiete, &lt; 4.000 nm/s),
    giallo (moderato, 4.000–9.000 nm/s), rosso (alto, &gt; 9.000 nm/s).
  </p>

  <script>
    fetch('tremore.json?t=' + Date.now())
      .then((r) => r.json())
      .then((data) => {
        document.getElementById('chart').src = 'tremore_chart.png?t=' + Date.now();
        var status = document.getElementById('status');
        if (data.latest) {
          var date = new Date(data.latest.timestamp);
          status.textContent =
            'Ultimo valore: ' + data.latest.value_nm_s + ' nm/s (stazione ' +
            data.latest.station + ') — aggiornato ' +
            date.toLocaleString('it-IT');
        } else {
          status.textContent = 'Nessun dato disponibile al momento.';
        }
      })
      .catch(() => {
        document.getElementById('status').textContent =
          'Impossibile caricare i dati aggiornati.';
      });
  </script>
</body>
</html>
