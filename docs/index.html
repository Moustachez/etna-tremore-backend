<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌋 Tremore vulcanico Etna</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="storia.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #141414;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.9);
            border: 1px solid #2a2a2a;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #e0e0e0;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 15px;
            text-align: center;
        }
        .section-title {
            font-size: 18px;
            color: #ccc;
            margin: 20px 0 15px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid #2a2a2a;
        }
        .card {
            background: #0f0f0f;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 6px solid #eab308;
        }
        .value {
            font-size: 48px;
            font-weight: 700;
            line-height: 1;
        }
        .unit {
            font-size: 20px;
            font-weight: 400;
            color: #aaa;
            margin-left: 5px;
        }
        .label {
            font-size: 24px;
            font-weight: 600;
            margin-top: 5px;
        }
        .station {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            background: #2a2a2a;
            color: #ccc;
        }
        .updated {
            font-size: 13px;
            color: #888;
            margin-top: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .station-card {
            background: #0f0f0f;
            border-radius: 12px;
            padding: 15px;
            border-left: 4px solid #444;
        }
        .station-name {
            font-weight: 600;
            font-size: 16px;
            color: #e0e0e0;
        }
        .station-value {
            font-size: 22px;
            font-weight: 700;
            margin-top: 3px;
        }
        .station-label {
            font-size: 14px;
            font-weight: 500;
            color: #aaa;
        }
        .chart-container {
            background: #0f0f0f;
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
            border: 1px solid #2a2a2a;
        }
        .source {
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #2a2a2a;
            padding-top: 15px;
            text-align: center;
        }
        .source a {
            color: #66aaff;
            text-decoration: none;
        }
        .source a:hover {
            text-decoration: underline;
        }
        .loading {
            color: #aaa;
            font-size: 18px;
            padding: 30px 0;
            text-align: center;
        }
        .error {
            color: #ff6666;
            padding: 20px;
            text-align: center;
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .value { font-size: 36px; }
            .label { font-size: 20px; }
            .container { padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><span>🌋</span> Tremore Etna</h1>
        <div class="subtitle">Monitoraggio in tempo reale</div>

        <div id="content">
            <div class="loading">⏳ Caricamento dati...</div>
        </div>

        <!-- GRAFICO RMS -->
        <div style="text-align:center; margin-top: 25px; margin-bottom: 10px;">
            <span style="font-size:20px; font-weight:bold; color:#e0e0e0;">RMS</span>
        </div>
        <div class="chart-container">
            <canvas id="ingvChart"></canvas>
        </div>

        <div class="source">
            Fonti: <a href="https://etnamonitor.it" target="_blank">EtnaMonitor.it</a> (nm/s) 
            e <a href="https://www.ct.ingv.it" target="_blank">INGV</a> (mV) · Dati aggiornati ogni 5 minuti
        </div>
    </div>

    <script>
        // ============================
        // CONFIGURAZIONE
        // ============================
        const ETNA_URL = 'tremore.json';
        const INGV_URL = 'ingv_all.json';
        const HISTORY_URL = null;
        let chartInstance = null;

        // ============================
        // UTILITY
        // ============================
        function formatTime(isoString) {
            if (!isoString) return 'N/D';
            try {
                const date = new Date(isoString);
                return date.toLocaleString('it-IT', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            } catch {
                return isoString;
            }
        }

        function getEmojiForLevel(level) {
            const emojis = { 'QUIETE': '🟢', 'MODERATO': '🟡', 'ALTO': '🔴' };
            return emojis[level] || '⚪';
        }

        function getColorForLevel(level) {
            const colors = { 'QUIETE': '#22c55e', 'MODERATO': '#eab308', 'ALTO': '#ef4444' };
            return colors[level] || '#94a3b8';
        }

        function createStationCard(stationName, data) {
            if (!data) {
                return `<div class="station-card" style="border-left-color:#444; opacity:0.6;">
                    <div class="station-name">${stationName}</div>
                    <div class="station-value" style="color:#666;">N/D</div>
                    <div class="station-label" style="color:#666;">Non disponibile</div>
                </div>`;
            }
            const color = data.color || '#94a3b8';
            const emoji = getEmojiForLevel(data.level);
            return `<div class="station-card" style="border-left-color:${color};">
                <div class="station-name">${stationName}</div>
                <div class="station-value" style="color:${color};">${data.rms_mV} <span style="font-size:14px;color:#aaa;">mV</span></div>
                <div class="station-label" style="color:${color};">${emoji} ${data.label || data.level}</div>
            </div>`;
        }

        // ============================
        // GRAFICO A LINEA CON BANDE
        // ============================
        function renderChart(historyData) {
            const canvas = document.getElementById('ingvChart');
            if (!canvas) return;

            // === USA LA STAZIONE ECPN (come INGV) ===
            const stationData = historyData['ECPN'] || historyData['ECNE'] || [];
            if (stationData.length < 2) {
                console.warn('Storico ECPN ha solo', stationData.length, 'valore/i. Servono almeno 2.');
                return;
            }

            const labels = stationData.map(d => new Date(d.timestamp));
            const values = stationData.map(d => d.rms_mV);

            if (chartInstance) {
                chartInstance.destroy();
            }

            const ctx = canvas.getContext('2d');

            // Plugin per le bande di colore
            const bandPlugin = {
                id: 'bandPlugin',
                beforeDraw: function(chart) {
                    const { ctx, chartArea, scales } = chart;
                    const yScale = scales.y;
                    const xScale = scales.x;

                    const bands = [
    { min: 0.08, max: 3.55, color: 'rgba(34, 197, 94, 0.30)' },   // VERDE (da 0.08 a 3.55 mV)
    { min: 3.55, max: 9.0, color: 'rgba(234, 179, 8, 0.30)' },    // GIALLO (da 3.55 a 9.0 mV)
    { min: 9.0, max: 100, color: 'rgba(239, 68, 68, 0.30)' }      // ROSSO (da 9.0 a 100 mV)
];

                    bands.forEach(band => {
                        const yMin = yScale.getPixelForValue(band.min);
                        const yMax = yScale.getPixelForValue(band.max);
                        const yTop = Math.min(yMin, yMax);
                        const yBottom = Math.max(yMin, yMax);

                        ctx.save();
                        ctx.fillStyle = band.color;
                        ctx.fillRect(xScale.left, yTop, xScale.right - xScale.left, yBottom - yTop);
                        ctx.restore();
                    });
                }
            };

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'RMS (mV)',
                        data: values,
                        borderColor: '#ffffff',
                        backgroundColor: 'rgba(0,0,0,0)',
                        borderWidth: 1.5,
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        tension: 0,
                        fill: false,
                        spanGaps: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    animation: { duration: 0 },
                    scales: {
                        y: {
                            type: 'logarithmic',
                            title: {
                                display: true,
                                text: 'mV',
                                color: '#ffffff',
                                font: { size: 14, weight: 'bold' }
                            },
                            min: 0.08,
                            max: 100,
                            grid: {
                                color: function(context) {
                                    const value = context.tick.value;
                                    if (value === 1 || value === 10 || value === 100) {
                                        return '#ffffff';
                                    }
                                    return 'rgba(255,255,255,0)';
                                },
                                lineWidth: function(context) {
                                    const value = context.tick.value;
                                    if (value === 1 || value === 10 || value === 100) {
                                        return 1.5;
                                    }
                                    return 0;
                                },
                                drawTicks: false
                            },
                            ticks: {
                                color: '#ffffff',
                                callback: function(value) {
                                    if (value === 0.1) return '10⁻¹';
                                    if (value === 1) return '10⁰';
                                    if (value === 10) return '10¹';
                                    if (value === 100) return '10²';
                                    return '';
                                }
                            }
                        },
                        x: {
                            type: 'time',
                            time: {
                                unit: 'minute',
                                displayFormats: {
                                    minute: 'HH:mm',
                                    hour: 'HH:mm',
                                    day: 'dd/MM'
                                }
                            },
                            title: {
                                display: true,
                                text: 'Tempo (UTC)',
                                color: '#ffffff',
                                font: { size: 12 }
                            },
                            grid: { display: false },
                            ticks: {
                                color: '#ffffff',
                                maxTicksLimit: 20,
                                maxRotation: 45,
                                minRotation: 30
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.parsed.y + ' mV';
                                }
                            }
                        }
                    }
                },
                plugins: [bandPlugin]
            });
        }

        // ============================
        // CARICAMENTO DATI
        // ============================
        async function loadData() {
            const container = document.getElementById('content');

            try {
                let etnaData = null;
                try {
                    const resp = await fetch(ETNA_URL + '?t=' + Date.now());
                    if (resp.ok) etnaData = await resp.json();
                } catch (e) {
                    console.warn('EtnaMonitor non disponibile:', e);
                }

                let ingvData = null;
                try {
                    const resp = await fetch(INGV_URL + '?t=' + Date.now());
                    if (resp.ok) ingvData = await resp.json();
                } catch (e) {
                    console.warn('INGV non disponibile:', e);
                }

                // --- DATI STORICI DA storia.js ---
                let historyData = null;
                if (typeof storiaData !== 'undefined' && storiaData) {
                    historyData = storiaData;
                    console.log('✅ Storico caricato da storia.js');
                } else {
                    console.warn('❌ Variabile storiaData non trovata');
                }

                if (historyData) {
                    renderChart(historyData);
                } else {
                    console.warn('Nessun dato storico per il grafico');
                }

                let html = '';

                // EtnaMonitor
                if (etnaData && etnaData.latest) {
                    const l = etnaData.latest;
                    const color = l.color || '#eab308';
                    const emoji = getEmojiForLevel(l.level);
                    html += `
                        <div class="section-title">📊 EtnaMonitor (ECNE)</div>
                        <div class="card" style="border-left-color:${color};">
                            <div class="value" style="color:${color};">${l.rms} <span class="unit">nm/s</span></div>
                            <div class="label" style="color:${color};">${emoji} ${l.label || l.level}</div>
                            <div class="station">Stazione ECNE <span class="badge">${l.level}</span></div>
                            <div class="updated">🕐 Aggiornato: ${formatTime(l.timestamp)}</div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="section-title">📊 EtnaMonitor (ECNE)</div>
                        <div class="card" style="border-left-color:#444;">
                            <div style="color:#888;">⏳ Dati non disponibili</div>
                        </div>
                    `;
                }

                // INGV
                if (ingvData && ingvData.stations) {
                    const stations = ingvData.stations;
                    html += `
                        <div class="section-title">📊 INGV (stazioni)</div>
                        <div class="grid">
                    `;
                    const order = ['ECNE', 'ECPN', 'ECBD', 'EMFS'];
                    order.forEach(key => {
                        html += createStationCard(key, stations[key] || null);
                    });
                    html += `
                        </div>
                    `;
                } else {
                    html += `
                        <div class="section-title">📊 INGV (stazioni)</div>
                        <div class="card" style="border-left-color:#444;">
                            <div style="color:#888;">⏳ Dati INGV non disponibili</div>
                        </div>
                    `;
                }

                container.innerHTML = html;

            } catch (error) {
                console.error('❌ Errore:', error);
                container.innerHTML = `
                    <div class="error">
                        ❌ Errore nel caricamento dei dati<br>
                        <span style="font-size:14px;color:#888;">${error.message}</span>
                    </div>
                `;
            }
        }

        // ============================
        // AVVIO
        // ============================
        loadData();
        setInterval(loadData, 60000);
    </script>
</body>
</html>
