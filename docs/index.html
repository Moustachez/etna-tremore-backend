<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌋 Tremore vulcanico Etna</title>
    <!-- Chart.js per il grafico -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #1e293b;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
            text-align: center;
        }
        .section-title {
            font-size: 18px;
            color: #94a3b8;
            margin: 20px 0 15px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid #334155;
        }
        .card {
            background: #0f172a;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        .card-etna {
            border-left: 6px solid #eab308;
        }
        .value {
            font-size: 48px;
            font-weight: 700;
            line-height: 1;
        }
        .unit {
            font-size: 20px;
            font-weight: 400;
            color: #94a3b8;
            margin-left: 5px;
        }
        .label {
            font-size: 24px;
            font-weight: 600;
            margin-top: 5px;
        }
        .station {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 5px;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            background: #334155;
            color: #94a3b8;
        }
        .updated {
            font-size: 13px;
            color: #64748b;
            margin-top: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .station-card {
            background: #0f172a;
            border-radius: 12px;
            padding: 15px;
            border-left: 4px solid #334155;
            transition: all 0.3s ease;
        }
        .station-name {
            font-weight: 600;
            font-size: 16px;
        }
        .station-value {
            font-size: 22px;
            font-weight: 700;
            margin-top: 3px;
        }
        .station-label {
            font-size: 14px;
            font-weight: 500;
        }
        .chart-container {
            background: #0f172a;
            border-radius: 16px;
            padding: 20px;
            margin-top: 10px;
        }
        .source {
            margin-top: 20px;
            font-size: 12px;
            color: #475569;
            border-top: 1px solid #334155;
            padding-top: 15px;
            text-align: center;
        }
        .source a {
            color: #60a5fa;
            text-decoration: none;
        }
        .source a:hover {
            text-decoration: underline;
        }
        .loading {
            color: #94a3b8;
            font-size: 18px;
            padding: 30px 0;
            text-align: center;
        }
        .error {
            color: #f87171;
            padding: 20px;
            text-align: center;
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
            .value { font-size: 36px; }
            .label { font-size: 20px; }
            .container { padding: 15px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><span>🌋</span> Tremore Etna</h1>
        <div class="subtitle">Monitoraggio in tempo reale</div>

        <div id="content">
            <div class="loading">⏳ Caricamento dati...</div>
        </div>

        <!-- GRAFICO INGV -->
        <div class="section-title" style="margin-top: 25px;">📈 Andamento RMS (INGV - ECNE)</div>
        <div class="chart-container">
            <canvas id="ingvChart"></canvas>
            <div style="font-size:12px;color:#64748b;text-align:right;margin-top:10px;">
                Scala logaritmica · Linee: 1 mV (giallo) e 9 mV (rosso)
            </div>
        </div>

        <div class="source">
            Fonti: <a href="https://etnamonitor.it" target="_blank">EtnaMonitor.it</a> (nm/s) 
            e <a href="https://www.ct.ingv.it" target="_blank">INGV</a> (mV) · Dati aggiornati ogni 5 minuti
        </div>
    </div>

    <script>
        const ETNA_URL = 'tremore.json';
        const INGV_URL = 'ingv_all.json';
        const HISTORY_URL = 'ingv_history.json';
        let chartInstance = null;

        // ============================
        // UTILITY
        // ============================
        function formatTime(isoString) {
            if (!isoString) return 'N/D';
            try {
                const date = new Date(isoString);
                return date.toLocaleString('it-IT', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            } catch {
                return isoString;
            }
        }

        function getEmojiForLevel(level) {
            const emojis = { 'QUIETE': '🟢', 'MODERATO': '🟡', 'ALTO': '🔴' };
            return emojis[level] || '⚪';
        }

        function getColorForLevel(level) {
            const colors = { 'QUIETE': '#22c55e', 'MODERATO': '#eab308', 'ALTO': '#ef4444' };
            return colors[level] || '#94a3b8';
        }

        function createStationCard(stationName, data) {
            if (!data) {
                return `<div class="station-card" style="border-left-color:#475569; opacity:0.5;">
                    <div class="station-name">${stationName}</div>
                    <div class="station-value" style="color:#475569;">N/D</div>
                    <div class="station-label" style="color:#475569;">Non disponibile</div>
                </div>`;
            }
            const color = data.color || '#94a3b8';
            const emoji = getEmojiForLevel(data.level);
            return `<div class="station-card" style="border-left-color:${color};">
                <div class="station-name">${stationName}</div>
                <div class="station-value" style="color:${color};">${data.rms_mV} <span style="font-size:14px;color:#94a3b8;">mV</span></div>
                <div class="station-label" style="color:${color};">${emoji} ${data.label || data.level}</div>
            </div>`;
        }

        // ============================
        // GRAFICO
        // ============================
        function renderChart(historyData) {
    const canvas = document.getElementById('ingvChart');
    if (!canvas) return;

    const stationData = historyData['ECNE'] || [];
    if (stationData.length < 2) {
        console.warn('Storico ECNE ha solo', stationData.length, 'valore/i. Servono almeno 2.');
        return;
    }

    const labels = stationData.map(d => new Date(d.timestamp));
    const values = stationData.map(d => d.rms_mV);
    const colors = stationData.map(d => getColorForLevel(d.level));

    if (chartInstance) {
        chartInstance.destroy();
    }

    const ctx = canvas.getContext('2d');
    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: 'RMS (mV)',
                data: values,
                backgroundColor: colors,
                borderColor: colors,
                borderWidth: 1,
                borderRadius: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: true,
            animation: { duration: 500 },
            scales: {
                y: {
                    type: 'logarithmic',
                    title: {
                        display: true,
                        text: 'RMS (mV)',
                        color: '#94a3b8',
                        font: { size: 14, weight: 'bold' }
                    },
                    min: 0.08,
                    max: 100,
                    grid: { color: '#334155' },
                    ticks: {
                        color: '#94a3b8',
                        callback: function(value) {
                            // Mostra le etichette in formato 10^0, 10^1, 10^2
                            if (value === 0.1) return '10⁻¹';
                            if (value === 1) return '10⁰';
                            if (value === 10) return '10¹';
                            if (value === 100) return '10²';
                            return '';
                        }
                    }
                },
                x: {
                    type: 'category',
                    title: {
                        display: true,
                        text: 'Tempo (UTC)',
                        color: '#94a3b8',
                        font: { size: 12 }
                    },
                    grid: { display: false },
                    ticks: {
                        color: '#94a3b8',
                        maxTicksLimit: 15,
                        maxRotation: 45,
                        minRotation: 30
                    }
                }
            },
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return context.parsed.y + ' mV';
                        }
                    }
                }
            }
        },
        plugins: [{
            id: 'thresholdLines',
            afterDraw: function(chart) {
                const yScale = chart.scales.y;
                const xScale = chart.scales.x;
                
                // Linea a 1 mV (10⁰) - BIANCA come INGV
                const y1 = yScale.getPixelForValue(1);
                if (y1 && y1 > 0) {
                    const ctx2 = chart.ctx;
                    ctx2.save();
                    ctx2.setLineDash([4, 4]);
                    ctx2.strokeStyle = '#ffffff';
                    ctx2.lineWidth = 1.5;
                    ctx2.beginPath();
                    ctx2.moveTo(xScale.left, y1);
                    ctx2.lineTo(xScale.right, y1);
                    ctx2.stroke();
                    ctx2.restore();
                    // Etichetta
                    ctx2.save();
                    ctx2.fillStyle = '#ffffff';
                    ctx2.font = '11px Arial';
                    ctx2.fillText('10⁰', xScale.right + 5, y1 - 4);
                    ctx2.restore();
                }
                
                // Linea a 10 mV (10¹) - BIANCA come INGV
                const y10 = yScale.getPixelForValue(10);
                if (y10 && y10 > 0) {
                    const ctx2 = chart.ctx;
                    ctx2.save();
                    ctx2.setLineDash([4, 4]);
                    ctx2.strokeStyle = '#ffffff';
                    ctx2.lineWidth = 1.5;
                    ctx2.beginPath();
                    ctx2.moveTo(xScale.left, y10);
                    ctx2.lineTo(xScale.right, y10);
                    ctx2.stroke();
                    ctx2.restore();
                    ctx2.save();
                    ctx2.fillStyle = '#ffffff';
                    ctx2.font = '11px Arial';
                    ctx2.fillText('10¹', xScale.right + 5, y10 - 4);
                    ctx2.restore();
                }
                
                // Linea a 100 mV (10²) - BIANCA come INGV (se visibile)
                const y100 = yScale.getPixelForValue(100);
                if (y100 && y100 > 0) {
                    const ctx2 = chart.ctx;
                    ctx2.save();
                    ctx2.setLineDash([4, 4]);
                    ctx2.strokeStyle = '#ffffff';
                    ctx2.lineWidth = 1.5;
                    ctx2.beginPath();
                    ctx2.moveTo(xScale.left, y100);
                    ctx2.lineTo(xScale.right, y100);
                    ctx2.stroke();
                    ctx2.restore();
                    ctx2.save();
                    ctx2.fillStyle = '#ffffff';
                    ctx2.font = '11px Arial';
                    ctx2.fillText('10²', xScale.right + 5, y100 - 4);
                    ctx2.restore();
                }
            }
        }]
    });
}

        // ============================
        // CARICAMENTO DATI
        // ============================
        async function loadData() {
            const container = document.getElementById('content');

            try {
                let etnaData = null;
                try {
                    const resp = await fetch(ETNA_URL + '?t=' + Date.now());
                    if (resp.ok) etnaData = await resp.json();
                } catch (e) {
                    console.warn('EtnaMonitor non disponibile:', e);
                }

                let ingvData = null;
                try {
                    const resp = await fetch(INGV_URL + '?t=' + Date.now());
                    if (resp.ok) ingvData = await resp.json();
                } catch (e) {
                    console.warn('INGV non disponibile:', e);
                }

                let historyData = null;
                try {
                    const resp = await fetch(HISTORY_URL + '?t=' + Date.now());
                    if (resp.ok) historyData = await resp.json();
                } catch (e) {
                    console.warn('Storico INGV non disponibile:', e);
                }

                // Renderizza il grafico se ci sono dati storici
                if (historyData) {
                    renderChart(historyData);
                } else {
                    console.warn('Nessun dato storico per il grafico');
                }

                let html = '';

                // EtnaMonitor
                if (etnaData && etnaData.latest) {
                    const l = etnaData.latest;
                    const color = l.color || '#eab308';
                    const emoji = getEmojiForLevel(l.level);
                    html += `
                        <div class="section-title">📊 EtnaMonitor (ECNE)</div>
                        <div class="card card-etna" style="border-left-color:${color};">
                            <div class="value" style="color:${color};">${l.rms} <span class="unit">nm/s</span></div>
                            <div class="label" style="color:${color};">${emoji} ${l.label || l.level}</div>
                            <div class="station">Stazione ECNE <span class="badge">${l.level}</span></div>
                            <div class="updated">🕐 Aggiornato: ${formatTime(l.timestamp)}</div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="section-title">📊 EtnaMonitor (ECNE)</div>
                        <div class="card" style="border-left-color:#475569;">
                            <div style="color:#94a3b8;">⏳ Dati non disponibili</div>
                        </div>
                    `;
                }

                // INGV
                if (ingvData && ingvData.stations) {
                    const stations = ingvData.stations;
                    html += `
                        <div class="section-title">📊 INGV (stazioni)</div>
                        <div class="grid">
                    `;
                    const order = ['ECNE', 'ECPN', 'ECBD', 'EMFS'];
                    order.forEach(key => {
                        html += createStationCard(key, stations[key] || null);
                    });
                    html += `
                        </div>
                        <div style="margin-top:10px;font-size:12px;color:#64748b;text-align:right;">
                            Aggiornato: ${formatTime(ingvData.timestamp)} · Canale ${ingvData.channel || 'HHZ'}
                        </div>
                    `;
                } else {
                    html += `
                        <div class="section-title">📊 INGV (stazioni)</div>
                        <div class="card" style="border-left-color:#475569;">
                            <div style="color:#94a3b8;">⏳ Dati INGV non disponibili</div>
                        </div>
                    `;
                }

                container.innerHTML = html;

            } catch (error) {
                console.error('❌ Errore:', error);
                container.innerHTML = `
                    <div class="error">
                        ❌ Errore nel caricamento dei dati<br>
                        <span style="font-size:14px;color:#94a3b8;">${error.message}</span>
                    </div>
                `;
            }
        }

        loadData();
        setInterval(loadData, 60000);
    </script>
</body>
</html>
